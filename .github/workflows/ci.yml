name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  quality:
    name: typecheck · lint · format · seed · i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Validate seed
        run: pnpm validate:seed

      - name: i18n parity check
        run: pnpm i18n:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint --if-present

  build:
    name: build · web
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @medina/web build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/node_modules/.cache/next-medina
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @medina/web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @medina/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  test-api:
    name: api · jest e2e (auth + me + products)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: medina_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ''
      MYSQL_DATABASE: medina_test
      JWT_SECRET: test_jwt_secret_at_least_32_chars_long_for_validation_xx
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_at_least_32_chars_long_for_validation_yy
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      PORT: '4001'
      NODE_ENV: test
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent; then echo "ready"; break; fi
            sleep 2
          done
      - name: Run API e2e
        run: pnpm --filter @medina/api test:e2e

  e2e-api-isolation:
    name: api · isolation (BLOCKING — security regression gate)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: medina_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ''
      MYSQL_DATABASE: medina_test
      JWT_SECRET: test_jwt_secret_at_least_32_chars_long_for_validation_xx
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_at_least_32_chars_long_for_validation_yy
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      PORT: '4001'
      NODE_ENV: test
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot --silent; then echo "ready"; break; fi
            sleep 2
          done
      - name: Run isolation tests
        run: pnpm --filter @medina/api test:isolation
